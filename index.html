<!doctype html>
<html lang="zh-CN">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta charset="utf-8">
<title>今日一色</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 美术课的木头桌子上：一张色卡、一只调色碗、一排颜料瓶。暖光、薄荷绿和珊瑚红。外观固定，不跟系统深色走 */
:root{
  color-scheme:light;
  --ink:#33302e;
  --soft:#7a716a;
  --mint:#5fc7a8;
  --mint-d:#3b9c80;
  --coral:#ff7a6b;
  --card:#fffaf3;
  --line:rgba(60,40,30,.14);
  --font-title:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  background-color:#ecd0aa;
  background-image:repeating-linear-gradient(0deg,rgba(120,70,30,0) 0 116px,rgba(120,70,30,.09) 116px 118px,rgba(255,255,255,.12) 118px 120px),radial-gradient(130% 80% at 50% 0%,#f8e7cf 0%,#efd3ae 55%,#dfb98b 100%);
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{width:min(440px,100%);margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}

/* 抬头 */
header{display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0}
.logo{margin:0;font-family:var(--font-title);font-weight:400;font-size:32px;line-height:1.05;color:var(--mint-d);text-shadow:0 3px 0 #fff;white-space:nowrap}
.sub{display:block;margin-top:3px;font-size:13px;font-weight:700;color:#8a5a34;white-space:nowrap}
.ibtn{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,250,243,.92);box-shadow:0 3px 10px rgba(60,30,10,.16);font-size:15px;font-weight:900;display:grid;place-items:center}

/* 今天的颜色：五金店里那种刷墙色卡 */
.paint{position:relative;border-radius:20px;background:var(--card);box-shadow:0 10px 24px rgba(80,40,10,.2);padding:8px;transform:rotate(-.6deg)}
.paint::before{content:"";position:absolute;left:22px;top:-9px;width:70px;height:22px;background:rgba(255,122,107,.72);border-radius:3px;transform:rotate(-5deg);box-shadow:0 2px 4px rgba(0,0,0,.08);z-index:2}
.paint .sw{position:relative;height:118px;border-radius:14px;transition:background-color .6s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.paint .sw::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 45%,rgba(0,0,0,.05));pointer-events:none}
.paint .hex{position:absolute;right:12px;bottom:9px;font-family:var(--font-num);font-weight:700;font-size:13px;letter-spacing:.06em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.paint .info{display:flex;align-items:flex-end;gap:10px;padding:8px 6px 2px}
.paint .nm{flex:1;min-width:0}
.paint .nm b{display:block;font-family:var(--font-title);font-weight:400;font-size:28px;line-height:1.15}
.paint .nm span{display:block;color:var(--soft);font-size:13px}
.diff{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding-bottom:2px}
.diff .dots{display:flex;gap:3px}
.diff .dots i{width:9px;height:9px;border-radius:50%;background:#e6dccf}
.diff .dots i.on{background:var(--coral)}
.diff span{font-size:12px;font-weight:700;color:var(--coral)}

/* 碗 */
.bowlbox{position:relative;display:grid;place-items:center}
#bowl{width:min(280px,72vw);aspect-ratio:1;display:block}
.bowl-note{position:absolute;bottom:47%;left:0;right:0;text-align:center;color:var(--soft);font-size:13px;font-weight:500;pointer-events:none}
.count{position:absolute;right:0;top:6px;padding:2px 11px;border-radius:999px;background:rgba(255,250,243,.92);box-shadow:0 3px 8px rgba(60,30,10,.12);font-size:13px;font-weight:700}
.count b{font-family:var(--font-num);font-size:15px}
.verdict{position:absolute;left:0;right:0;top:42%;text-align:center;pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.4)}
.verdict.show{opacity:1;transform:none}
.verdict b{display:inline-block;padding:5px 18px;border-radius:999px;background:var(--ink);color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.2);font-family:var(--font-title);font-weight:400;font-size:26px}

/* 颜料瓶 */
.tray{border-radius:22px;background:var(--card);box-shadow:0 8px 20px rgba(80,40,10,.16);padding:10px 6px 8px}
.dishes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dish{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:12px 0 0}
.dish .d{position:relative;width:32px;height:42px;border-radius:9px 9px 12px 12px;background:linear-gradient(90deg,rgba(255,255,255,.42) 0 16%,rgba(255,255,255,0) 38%,rgba(0,0,0,.1) 100%),var(--c);box-shadow:0 4px 8px rgba(60,30,10,.2),inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .12s}
.dish .d::before{content:"";position:absolute;left:50%;top:-9px;width:18px;height:11px;transform:translateX(-50%);border-radius:5px 5px 2px 2px;background:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.06)}
.dish .d::after{content:"";position:absolute;left:50%;top:-15px;width:6px;height:8px;transform:translateX(-50%);border-radius:3px 3px 1px 1px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.dish.white .d{box-shadow:0 4px 8px rgba(60,30,10,.16),inset 0 -3px 0 rgba(0,0,0,.08),inset 0 0 0 1.5px var(--line)}
.dish:active .d{transform:scale(.9) rotate(-6deg)}
.dish .n{font-weight:700;font-size:13px;line-height:1}
.dish .k{position:absolute;top:0;right:calc(50% - 26px);z-index:1;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--coral);color:#fff;font-family:var(--font-num);font-size:12px;font-weight:800;line-height:19px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.dish:disabled{opacity:.45}

.ctrl{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:14px;padding:11px 10px;font-weight:900;font-size:15px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 8px rgba(60,30,10,.08)}
.btn.main{flex:1.7;background:var(--mint);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 8px 18px rgba(40,120,100,.3)}
.btn:disabled{opacity:.45}
.btn:active:not(:disabled){transform:translateY(2px)}

/* 每一次比一比 */
.tries{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.try{display:flex;flex-direction:column;align-items:center;gap:2px}
.try .sw{width:38px;height:38px;border-radius:50%;border:2px dashed rgba(90,50,20,.22)}
.try.done .sw{border:3px solid #fff;box-shadow:0 3px 8px rgba(60,30,10,.18)}
.try .p{font-family:var(--font-num);font-size:14px;font-weight:800;color:var(--soft);min-height:1.4em;line-height:1.4}
.try.best .p{color:var(--mint-d)}
.hints{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:30px}
.hint{padding:3px 12px;border-radius:999px;background:rgba(255,250,243,.92);box-shadow:0 2px 6px rgba(60,30,10,.1);font-size:13px;font-weight:700}
.hint.big{background:var(--ink);color:#fff;box-shadow:none}
footer{text-align:center;color:#8a6a4c;font-size:12px;font-weight:500}

/* 弹窗 */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(50,30,20,.45)}
.card{width:min(380px,100%);max-height:calc(100% - 16px);overflow:auto;border-radius:24px;background:var(--card);box-shadow:0 24px 60px rgba(40,20,10,.35);padding:22px 18px 18px;display:flex;flex-direction:column;gap:12px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(14px) scale(.95);opacity:0}}
.card h2{margin:0;font-family:var(--font-title);font-weight:400;font-size:30px;text-align:center}
.card p{margin:0}
.how{margin:0;padding-left:1.2em;font-size:14px;display:flex;flex-direction:column;gap:6px}
.card .swatch{position:relative;height:110px;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.card .swatch .name{position:absolute;left:14px;bottom:8px;font-family:var(--font-title);font-size:30px;line-height:1.1}
.card .swatch .hex{position:absolute;right:14px;top:10px;font-family:var(--font-num);font-weight:700;font-size:13px;letter-spacing:.06em}
.score{text-align:center;font-family:var(--font-num);font-weight:800;font-size:56px;line-height:1;color:var(--mint-d)}
.score small{display:block;margin-top:6px;font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--soft)}
.recipe{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.recipe .r{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--soft)}
.recipe .r i{display:block;width:26px;height:32px;margin-bottom:3px;border-radius:7px 7px 9px 9px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),inset 0 0 0 1px rgba(0,0,0,.08)}
.recipe .r b{font-size:13px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px;padding:10px 0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.stats b{display:block;font-family:var(--font-num);font-weight:800;font-size:24px;line-height:1.2}
.stats span{font-size:12px;color:var(--soft)}
.row{display:flex;gap:8px}
.row > *{flex:1}
.small{font-size:12px;color:var(--soft);text-align:center}
/* 排行榜 */
.blist{display:flex;flex-direction:column;gap:6px;min-height:120px;max-height:52vh;overflow:auto;margin:0 -4px;padding:2px 4px}
.brow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.brow.me{background:#e6f7f1;box-shadow:inset 0 0 0 2px var(--mint)}
.brow .rk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-num);font-weight:800;font-size:14px;color:var(--soft)}
.brow .rk.g1{background:#ffd54f;color:#7a5200}.brow .rk.g2{background:#dfe3e8;color:#4a5560}.brow .rk.g3{background:#f1c39a;color:#7a3f12}
.brow i{flex:none;width:26px;height:26px;border-radius:8px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.brow .bn{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bs{flex:none;text-align:right;font-size:12px;color:var(--soft);line-height:1.25}
.brow .bs b{display:block;font-family:var(--font-num);font-weight:800;font-size:15px;color:var(--ink)}
.brow .bs b.fail{color:var(--soft)}
.bnote{text-align:center;font-size:13px;color:var(--soft);padding:16px 0}
.mine{text-align:center;font-size:14px;font-weight:700;color:var(--mint-d)}
.name-field{width:100%;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:17px;font-weight:700;background:#fff;box-shadow:inset 0 0 0 2px var(--line);outline:none;-webkit-user-select:text;user-select:text}
.name-field:focus{box-shadow:inset 0 0 0 2px var(--mint)}
.name-err{min-height:1.2em;margin:4px 0 0;font-size:12px;color:var(--coral);text-align:center}
.toast{position:fixed;left:50%;top:18px;z-index:30;transform:translate(-50%,-10px);opacity:0;padding:8px 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:700;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand"><h1 class="logo" id="title">今日一色</h1><span class="sub" id="sub"></span></div>
    <button class="ibtn" id="btnBoard" type="button" aria-label="排行榜">🏆</button>
    <button class="ibtn" id="btnPractice" type="button" aria-label="练一练">练</button>
    <button class="ibtn" id="btnHelp" type="button" aria-label="怎么玩">?</button>
    <button class="ibtn" id="btnSound" type="button" aria-label="声音">🔊</button>
  </header>

  <div class="paint" id="target">
    <div class="sw" id="tSw"><span class="hex" id="tHex"></span></div>
    <div class="info">
      <div class="nm"><b id="tName"></b><span id="tDesc"></span></div>
      <div class="diff" id="tDiff"></div>
    </div>
  </div>

  <div class="bowlbox">
    <canvas id="bowl" aria-label="调色碗"></canvas>
    <span class="count" id="count"></span>
    <div class="bowl-note" id="bowlNote">点下面的颜料，往碗里滴</div>
    <div class="verdict" id="verdict"><b></b></div>
  </div>

  <div class="tray"><div class="dishes" id="dishes"></div></div>

  <div class="ctrl">
    <button class="btn" id="btnUndo" type="button">撤一滴</button>
    <button class="btn" id="btnPour" type="button">倒掉</button>
    <button class="btn main" id="btnCheck" type="button">比一比</button>
  </div>

  <div class="hints" id="hints"></div>
  <div class="tries" id="tries"></div>
  <footer id="foot">每天一个颜色 · 六次机会 · 周末最难</footer>
</div>
<div id="modal" hidden></div>
<div class="toast" id="toast"></div>

function mix(counts){
  let tot = 0;

  const C1p = Math.hypot(a1p, b1), C2p = Math.hypot(a2p, b2);
  const h = (x, y) => { if (!x && !y) return 0; const t = Math.atan2(y, x) / rad; return t < 0 ? t + 360 : t; };
  const h1p = h(a1p, b1), h2p = h(a2p, b2);
  const dLp = L2 - L1, dCp = C2p - C1p;
  let dhp = 0;
  if (C1p * C2p){ dhp = h2p - h1p; if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360; }
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(dhp / 2 * rad);
  const Lm = (L1 + L2) / 2, Cmp = (C1p + C2p) / 2;
  let hm = h1p + h2p;
  if (C1p * C2p){ if (Math.abs(h1p - h2p) > 180) hm += h1p + h2p < 360 ? 360 : -360; hm /= 2; }
  const T = 1 - .17 * Math.cos((hm - 30) * rad) + .24 * Math.cos(2 * hm * rad) + .32 * Math.cos((3 * hm + 6) * rad) - .2 * Math.cos((4 * hm - 63) * rad);
  const dTh = 30 * Math.exp(-(((hm - 275) / 25) ** 2));
  const Rc = 2 * Math.sqrt(Cmp ** 7 / (Cmp ** 7 + 25 ** 7));
  const Sl = 1 + .015 * (Lm - 50) ** 2 / Math.sqrt(20 + (Lm - 50) ** 2), Sc = 1 + .045 * Cmp, Sh = 1 + .015 * Cmp * T;
  const Rt = -Math.sin(2 * dTh * rad) * Rc;
  return Math.sqrt((dLp / Sl) ** 2 + (dCp / Sc) ** 2 + (dHp / Sh) ** 2 + Rt * (dCp / Sc) * (dHp / Sh));
}

// 显示用：调到肉眼分不出来（99.5 以上）就算 100
const pct = s => (s >= 99.5 ? 100 : Math.floor(s));

const HUES = [[25, '红'], [70, '橙'], [105, '黄'], [160, '绿'], [215, '青'], [285, '蓝'], [345, '紫'], [360, '红']];

function hints(mixLab, tLab){

  const [Lm, Cm, hm] = lch(mixLab), [Lt, Ct, ht] = lch(tLab);
  if (Lm - Lt > 3) out.push('偏亮'); else if (Lt - Lm > 3) out.push('偏暗');
  if (Ct > 6 || Cm > 6){
    let dh = hm - ht; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;

}
const lerpLin = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

// 一周里越往后越难：周一周二 3 星，周三到周五 4 星，周末 5 星
const START = Date.UTC(2026, 9, 4);
function dayNo(d = new Date()){ return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - START) / 864e5) + 1; }
const weekday = n => new Date(START + (n - 1) * 864e5).getUTCDay();
const starsOf = n => { const w = weekday(n); return w === 0 || w === 6 ? 5 : w >= 3 ? 4 : 3; };

const ORDER = {};
for (const s of [3, 4, 5]){
  const r = seeded(20261004 + s), idx = COLORS.map((c, i) => (c.stars === s ? i : -1)).filter(i => i >= 0);
  for (let i = idx.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  ORDER[s] = idx;
}
const TODAY = Math.max(1, dayNo());
function colorOfDay(n){
  const s = starsOf(n);
  let k = 0;
  for (let d = 1; d < n; d++) if (starsOf(d) === s) k++;
  return COLORS[ORDER[s][k % ORDER[s].length]];
}
const STAR_TXT = {3: '有点难', 4: '挺难', 5: '超难'};

  S = {practice, color: c, tLin: hexToRgb(c.hex).map(toLin), counts: PIGMENTS.map(() => 0), history: [], tries: [], done: false};
  S.tLab = linToLab(S.tLin);
  if (saved){ S.counts = saved.counts; S.history = saved.history || []; S.tries = saved.tries; S.done = saved.done; S.t0 = saved.t0 || 0; S.secs = saved.secs; }

const cv = $('bowl'), ctx = cv.getContext('2d');
let shown = null, blobs = [], drips = [], ripples = [], size = 280;
function fit(){ const r = cv.getBoundingClientRect(); size = r.width; const d = Math.min(devicePixelRatio || 1, 2.5); cv.width = cv.height = Math.round(size * d); ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', fit);
function drawBowl(t){
  const c = ctx, W = size, cx = W / 2, cy = W / 2, R = W * .46;
  c.clearRect(0, 0, W, W);
  // 桌上的影子
  c.fillStyle = 'rgba(90,45,10,.18)';
  c.beginPath(); c.ellipse(cx + R * .05, cy + R * .12, R * 1.02, R * .98, 0, 0, 7); c.fill();
  // 白瓷碗，碗沿一圈薄荷绿
  const rim = c.createRadialGradient(cx - R * .3, cy - R * .35, R * .2, cx, cy, R);
  rim.addColorStop(0, '#ffffff'); rim.addColorStop(.75, '#fbf6ee'); rim.addColorStop(1, '#e6dccd');
  c.fillStyle = rim; c.beginPath(); c.arc(cx, cy, R, 0, 7); c.fill();
  c.strokeStyle = '#5fc7a8'; c.lineWidth = R * .05;
  c.beginPath(); c.arc(cx, cy, R * .935, 0, 7); c.stroke();
  c.fillStyle = '#fff';
  for (let k = 0; k < 28; k++){ const a = k / 28 * Math.PI * 2; c.beginPath(); c.arc(cx + Math.cos(a) * R * .935, cy + Math.sin(a) * R * .935, R * .011, 0, 7); c.fill(); }
  // 碗里
  const inner = R * .85;
  const wall = c.createRadialGradient(cx, cy + R * .12, inner * .25, cx, cy, inner);
  wall.addColorStop(0, '#fffdf9'); wall.addColorStop(1, '#ebe2d4');
  c.fillStyle = wall; c.beginPath(); c.arc(cx, cy, inner, 0, 7); c.fill();
  // 颜料
  const used = S ? dropsUsed() : 0;
  if (shown){
    const pr = inner * (.6 + .32 * Math.min(1, used / 14));
    c.save();
    c.beginPath(); c.arc(cx, cy + inner * .03, pr, 0, 7); c.clip();
    c.fillStyle = linToCss(shown); c.fillRect(cx - pr, cy - pr, pr * 2, pr * 2 + inner * .06);
    // 刚滴进去的颜料打着旋化开
    for (const b of blobs){
      const u = Math.min(1, (t - b.t0) / 1100), a0 = b.a + u * 5.5;
      c.strokeStyle = b.color; c.lineCap = 'round';
      for (let k = 0; k < 3; k++){
        c.globalAlpha = (1 - u) * (.75 - k * .2);

        const rr = pr * (.12 + u * .55 + k * .1);
        c.beginPath(); c.arc(cx + Math.cos(b.a) * pr * .2 * (1 - u), cy + Math.sin(b.a) * pr * .2 * (1 - u), rr, a0 + k * 2.1, a0 + k * 2.1 + 1.6 + u * 1.5); c.stroke();
      }
      c.globalAlpha = 1;
    }
    // 液面的光
    const gl = c.createRadialGradient(cx - pr * .4, cy - pr * .45, 0, cx - pr * .4, cy - pr * .45, pr * .9);
    gl.addColorStop(0, 'rgba(255,255,255,.35)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = gl; c.fillRect(cx - pr, cy - pr, pr * 2, pr * 2);
    const ed = c.createRadialGradient(cx, cy, pr * .8, cx, cy, pr);
    ed.addColorStop(0, 'rgba(0,0,0,0)'); ed.addColorStop(1, 'rgba(0,0,0,.14)');
    c.fillStyle = ed; c.fillRect(cx - pr, cy - pr, pr * 2, pr * 2);
    for (const r of ripples){ const u = (t - r.t0) / 900; if (u >= 1) continue; c.strokeStyle = `rgba(255,255,255,${.5 * (1 - u)})`; c.lineWidth = 1.5; c.beginPath(); c.arc(r.x, r.y, 4 + u * pr * .5, 0, 7); c.stroke(); }

    const u = Math.min(1, (t - d.t0) / 260);
    const y = d.y0 + (d.y1 - d.y0) * u * u;
    c.fillStyle = d.color;
    c.beginPath(); c.moveTo(d.x, y - 12); c.bezierCurveTo(d.x + 7, y - 2, d.x + 6, y + 6, d.x, y + 6); c.bezierCurveTo(d.x - 6, y + 6, d.x - 7, y - 2, d.x, y - 12); c.fill();

  }
}
let last = 0;
function frame(t){
  if (S){
    const target = mixed();
    if (target && shown){ shown = lerpLin(shown, target, Math.min(1, (t - last) / 1000 * 2.4)); }
    else shown = target;
    blobs = blobs.filter(b => t - b.t0 < 1100);
    drips = drips.filter(d => t - d.t0 < 260);
    ripples = ripples.filter(r => t - r.t0 < 900);
    drawBowl(t);
  }
  last = t;
  requestAnimationFrame(frame);
}

/* ---------- 操作 ---------- */
function addDrop(i){
  if (S.done || dropsUsed() >= MAX_DROPS) return;
  Sound.unlock();
  const t = performance.now(), cx = size / 2, inner = size * .46 * .85;
  const a = Math.random() * Math.PI * 2, d = Math.random() * inner * .35;
  const x = cx + Math.cos(a) * d, y = size / 2 + Math.sin(a) * d;
  drips.push({x, y0: -10, y1: y, t0: t, color: PIGMENTS[i].hex});
  setTimeout(() => {
    const was = shown;
    if (!S.t0) S.t0 = Date.now();
    S.counts[i]++;
    S.history.push(i);
    if (!was) shown = mixed();
    blobs.push({color: PIGMENTS[i].hex, a, t0: performance.now()});
    ripples.push({x, y, t0: performance.now()});
    Sound.drop(i);
    save();
    render();
  }, 240);
}
function undo(){ if (!S.history.length || S.done) return; const i = S.history.pop(); S.counts[i]--; if (!dropsUsed()) shown = null; Sound.tick(); save(); render(); }

function check(){
  if (S.done){ showResult(false); return; }
  const m = mixed();
  if (!m) return;
  const lab = linToLab(m), s = similarity(lab, S.tLab);
  const h = s >= 99.5 ? [] : hints(lab, S.tLab);
  S.tries.push({s, hex: linToHex(m), h, counts: S.counts.slice()});

  v.classList.add('show');

function record(){

}

let api = async (path, body) => {
  const headers = {apikey: BOARD.key, 'Content-Type': 'application/json'};
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(BOARD.url + '/rest/v1/' + path, body ? {method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal} : {headers, signal: ctl.signal});
    if (!r.ok) throw new Error('http ' + r.status);
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  } finally {
    clearTimeout(timer);
  }
};

function queueScore(){
  const best = Math.max(...S.tries.map(t => t.s)), bt = S.tries.find(t => t.s === best);
  store.set('pending', {day: TODAY, tries: S.tries.length, best: Math.round(Math.min(100, best) * 10) / 10, secs: S.secs == null ? null : Math.min(86400, S.secs), hex: bt.hex});
}
async function flushScore(){
  const sc = store.get('pending', null), m = me();
  if (!sc || !m.name || PREVIEW) return null;
  if (sc.day !== TODAY && sc.day !== TODAY - 1){ store.set('pending', null); return null; }
  const res = await api('rpc/jrys_submit', {p_day: sc.day, p_player: m.pid, p_tag: m.tag, p_name: m.name, p_tries: sc.tries, p_best: sc.best, p_secs: sc.secs, p_hex: sc.hex});

  store.set('posted', sc.day);

}
const fmtSecs = s => (s == null ? '' : s >= 3600 ? '1 小时以上' : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);

function askName(then){
  const card = el('div', 'card');
  const m = me();

  input.setAttribute('aria-label', '昵称');
  const err = el('p', 'name-err');
  err.setAttribute('role', 'alert');
  card.append(input, err);
  const ok = () => {
    const name = input.value.trim().slice(0, 12);
    if (!name){ err.textContent = '先起个名字'; input.focus(); return; }
    const renamed = m.name && m.name !== name;
    store.set('me', Object.assign(me(), {name}));
    if (renamed && !PREVIEW) api('rpc/jrys_rename', {p_player: m.pid, p_name: name}).catch(() => {});
    then();
  };
  // 回车只算一次：不拦住的话，这一下还会按到下一个弹窗里的按钮
  input.addEventListener('keydown', e => { if (e.key !== 'Enter' || e.isComposing) return; e.preventDefault(); ok(); });
  const row = el('div', 'row');
  const skip = el('button', 'btn', m.name ? '不改了' : '先不上榜');
  skip.type = 'button';
  skip.addEventListener('click', m.name ? then : closeModal);
  const go = el('button', 'btn main', '好了');
  go.type = 'button';
  go.addEventListener('click', ok);
  row.append(skip, go);
  card.appendChild(row);
  openModal(card);
  // 改名的时候旧名字整个选中，直接打字就替换掉
  setTimeout(() => { input.focus(); input.select(); }, 60);
}

const Sound = (() => {

})();
